# The options of an exploration, for explore.py --config; paths are
# relative to the directory explore.py was run from.
# conceptual-exploration commit 4b998b47625bc3ea7dad7e4c4df3675a7a66987c; ETP data of commit 1aec8a7acf223b7c56e4830977b6e90d4ef1924b (etp_version.json).

equations = "explorations/equational_theories/equations_semigroup.json"
expert = "vampire"
vampire-prove-time-limit = 10
vampire-first-time-limit = 3
vampire-model-time-limit = 300
vampire-quick-model-time-limit = 1
vampire-row-time-limit = 0
mace4-time-limit = 600
model-premise = "simplified"
eprover-time-limit = 2
min-search-size = 1
max-search-size = 6
z3-timeout-ms = 30000
report-every = 1
# background-order not set
background-premise-size = 2
seed-magmas = []
seed-context = ["etp/magmas/cancellative-manual.txt", "etp/magmas/extra.txt", "etp/magmas/manual-11x11.txt", "etp/magmas/manual-13x13.txt", "etp/magmas/manual-5x5.txt", "etp/magmas/plan.txt", "etp/magmas/refutations2x2.txt", "etp/magmas/refutations3x3.txt", "etp/magmas/refutations4x4.txt", "etp/magmas/smallest_magma_examples.txt", "etp/magmas/vampire-generated.txt", "etp/magmas/z3-generated.txt"]
# background-transient-order not set
etp-graph = "etp/graph.json"
axiom = ["4512"]
no-duality = false
ask-unconfirmed-duals = false
etp-refutations = false
etp-equations = "etp/equations.txt"
