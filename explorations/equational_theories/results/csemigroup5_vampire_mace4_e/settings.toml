# The options of an exploration, for explore.py --config; paths are
# relative to the directory explore.py was run from.
# conceptual-exploration commit 1904bafa5c0a7b8db79732cf61b6930225ba1eaa; ETP data of commit 1aec8a7acf223b7c56e4830977b6e90d4ef1924b (etp_version.json).

equations = "explorations/equational_theories/equations_csemigroup5.json"
expert = "vampire"
vampire-prove-time-limit = 10
vampire-first-time-limit = 3
vampire-model-time-limit = 300
vampire-quick-model-time-limit = 1
vampire-row-time-limit = 0
mace4-time-limit = 600
model-premise = "simplified"
eprover-time-limit = 2
min-search-size = 1
max-search-size = 6
z3-timeout-ms = 30000
report-every = 1
# background-order not set
background-premise-size = 2
seed-magmas = []
seed-context = ["explorations/equational_theories/seeds_csemigroup5.json", "explorations/equational_theories/results/semigroup_vampire_mace4_e_etp_classes/magmas.json", "etp/magmas/cancellative-manual.txt", "etp/magmas/extra.txt", "etp/magmas/manual-11x11.txt", "etp/magmas/manual-13x13.txt", "etp/magmas/manual-5x5.txt", "etp/magmas/plan.txt", "etp/magmas/refutations2x2.txt", "etp/magmas/refutations3x3.txt", "etp/magmas/refutations4x4.txt", "etp/magmas/smallest_magma_examples.txt", "etp/magmas/vampire-generated.txt", "etp/magmas/z3-generated.txt"]
background = ["explorations/equational_theories/background_csemigroup5.json"]
# background-transient-order not set
# etp-graph not set
axiom = ["4512", "43"]
no-duality = true
ask-unconfirmed-duals = false
etp-refutations = false
# etp-equations not set
