# The options of an exploration, for explore.py --config; paths are
# relative to the directory explore.py was run from.
# conceptual-exploration commit f806ff92e70ad36a6c41ba993962c80a7bac2b95; ETP data of commit 1aec8a7acf223b7c56e4830977b6e90d4ef1924b (etp_version.json).

equations = "explorations/equational_theories/equations_semigroup5.json"
expert = "vampire"
vampire-prove-time-limit = 10
vampire-first-time-limit = 3
vampire-model-time-limit = 300
vampire-quick-model-time-limit = 1
vampire-row-time-limit = 0
mace4-time-limit = 600
model-premise = "simplified"
truncation-words = 20000
eprover-time-limit = 2
min-search-size = 1
max-search-size = 6
z3-timeout-ms = 30000
report-every = 1
# background-order not set
background-premise-size = 2
seed-magmas = []
seed-context = ["explorations/equational_theories/seeds_semigroup5.json"]
background = ["explorations/equational_theories/background_semigroup5.json"]
# background-transient-order not set
# etp-graph not set
axiom = ["4512"]
no-duality = false
ask-unconfirmed-duals = false
etp-refutations = false
# etp-equations not set
